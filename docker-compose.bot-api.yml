# Existing Local API music cache: python3 scripts/prepare-telegram-music.py
# Optional production override: docker compose -f docker-compose.yml -f docker-compose.bot-api.yml up -d
services:
  telegram-api:
    image: muism:telegram-api-e3e9dd8e
    build:
      context: .
      dockerfile: Dockerfile.telegram-api
    container_name: muism-telegram-api
    restart: unless-stopped
    env_file: .telegram-api.env
    volumes:
      - ./data/telegram-api:/var/lib/telegram-bot-api
    # No published ports. Only services in the Compose network can access it.
    init: true
    mem_limit: 1g
    cpus: 1.0
  bot:
    # Read only this bot's music cache, without exposing the API database.
    group_add: ["10001"]
    volumes:
      - type: bind
        source: ./data/telegram-music
        target: /app/telegram-music
        read_only: true
    environment:
      BOT_API_BASE_URL: http://telegram-api:8081
      BOT_API_LOCAL: "1"
      BOT_API_MUSIC_DIR: /app/telegram-music
    depends_on:
      telegram-api:
        condition: service_started
