name: ismusicnow
services:
  web:
    image: ismusicnow:local
    build: .
    container_name: ismusicnow-web
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/.data
      VOTIFY_BIN: /app/.venv/bin/votify
      YTDLP_BIN: /app/.venv/bin/yt-dlp
      SPOTIFY_COOKIES_PATH: /app/secrets/spotify-cookies.txt
    ports:
      - "127.0.0.1:28500:3000"
    volumes:
      - ./data/web:/app/.data
      - ./secrets:/app/secrets:ro
    init: true
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok||r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
  bot:
    image: ismusicnow:local
    container_name: ismusicnow-bot
    command: ["node", "--import", "tsx", "scripts/bot.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/.data
      VOTIFY_BIN: /app/.venv/bin/votify
      YTDLP_BIN: /app/.venv/bin/yt-dlp
      SPOTIFY_COOKIES_PATH: /app/secrets/spotify-cookies.txt
    volumes:
      - ./data/bot:/app/.data
      - ./secrets:/app/secrets:ro
    init: true
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      web:
        condition: service_started
